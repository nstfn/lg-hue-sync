# 70-watchdog: systemd restarts the daemon if it freezes.
# Restricts: nothing; it adds supervision. The daemon sends READY=1 once it is
#   initialised (src/main.rs, sd_notify Ready) and WATCHDOG=1 at half the
#   deadline from the frame loop, the paused loop and the capture restart path
#   (WatchdogHeartbeat). Without WatchdogSec it sends no ping, so this layer is
#   what turns the heartbeat on.
# 60 s: far above the longest known blocking step (a bridge sync of a few
#   seconds, a capture restart backoff of at most 16 s). On a timeout, systemd
#   sends SIGABRT (LimitCORE=0 keeps it without a core file), then
#   Restart=always starts it again; the start limit of the base unit still
#   stops a loop.
# Could break: a start that never sends READY=1 fails after TimeoutStartSec;
#   the boot hook uses `--no-block start`, so boot never waits on it.
# Check: systemctl show -p Type,NotifyAccess,WatchdogUSec,NRestarts lg-hue-sync
#   (Type=notify, WatchdogUSec=1min); `systemctl status lg-hue-sync` shows the
#   daemon's STATUS= text; no "Watchdog timeout" in daemon.log after an hour.
# Revert: rm this file in the install directory and in
#   /run/systemd/system/lg-hue-sync.service.d/, then systemctl daemon-reload &&
#   systemctl restart lg-hue-sync.
[Service]
Type=notify
NotifyAccess=main
WatchdogSec=60s
TimeoutStartSec=90s
