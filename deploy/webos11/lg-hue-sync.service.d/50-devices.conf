# 50-devices: device nodes limited to the capture device.
# Restricts: the cgroup v1 "devices" controller (devices.allow/deny, no BPF)
#   allows only /dev/video60 (rw) plus the pseudo devices that
#   DevicePolicy=closed always allows: /dev/null, /dev/zero, /dev/full,
#   /dev/random, /dev/urandom (and /dev/tty, /dev/ptmx, /dev/pts/*).
#   The path form resolves the major:minor at start. If /dev/video60 is
#   missing at start, systemd skips the entry and the capture fails.
#   "char-video4linux" would allow every video device (major 81), but only if
#   the LG driver uses major 81: check with ls -l /dev/video60.
# /dev/shm needs nothing here: it is a tmpfs, not a device node. The device
#   cgroup does not cover pmloglib.lock or ls2.monitor.shm.
# Could break: a device that libvtcapture opens only at capture init (for
#   example /dev/dma_heap/*, /dev/ion or a GPU node). The steady-state fd list
#   showed /dev/video60 and /dev/null only. Symptom: open() fails with EPERM.
# Check: systemctl show lg-hue-sync -p DevicePolicy -p DeviceAllow
#   CG=$(systemctl show -p ControlGroup --value lg-hue-sync); cat /sys/fs/cgroup/devices$CG/devices.list
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/50-devices.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
DevicePolicy=closed
DeviceAllow=/dev/video60 rw
