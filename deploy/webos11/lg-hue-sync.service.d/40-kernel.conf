# 40-kernel: no changes to kernel state.
# Restricts: /proc/sys and /sys read-only; no module load; no kernel log
#   (/dev/kmsg, /proc/kmsg, syslog()); /sys/fs/cgroup read-only; a private
#   hostname; no clock or RTC changes.
# WARNING, ProtectClock=yes: systemd adds an implicit "DeviceAllow=char-rtc r".
#   With the default DevicePolicy=auto, one DeviceAllow= entry turns the device
#   cgroup into an allowlist. Without the line below, this file alone would
#   block /dev/video60 and stop the capture. The DeviceAllow line is repeated
#   in 50-devices.conf; entries add up, so the duplicate is harmless.
# Could break: pmloglib or libvtcapture writing to /dev/kmsg; any sysfs or
#   /proc/sys write by libvtcapture.
# Check: systemctl show lg-hue-sync -p ProtectKernelTunables -p ProtectKernelModules -p ProtectKernelLogs -p ProtectControlGroups -p ProtectHostname -p ProtectClock -p DeviceAllow
#   CG=$(systemctl show -p ControlGroup --value lg-hue-sync); cat /sys/fs/cgroup/devices$CG/devices.list
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/40-kernel.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
ProtectClock=yes
DeviceAllow=/dev/video60 rw
