# 60-syscalls: seccomp system call filter.
# Restricts: native ABI only (no other ABI on this kernel); the
#   @system-service set minus @privileged (no setuid/setgid family, chown,
#   mount, reboot, module, raw I/O, clock calls, and more); no memory that is
#   writable and executable at once; sockets limited to Unix, IPv4, IPv6 and
#   netlink. A denied call returns EPERM; the process is not killed.
#   ARMv7 uses a direct socket() system call, so RestrictAddressFamilies works.
# Needs a systemd built with +SECCOMP (systemctl --version). Without it,
#   systemd skips these settings, and Seccomp in /proc/<pid>/status stays 0.
# Children inherit the filter: luna-send and systemctl run under it too.
# Could break: an ARM-specific call (cacheflush, set_tls) outside
#   @system-service; a luna-send that calls setgid/setgroups (@privileged);
#   a library that maps W+X memory (a JIT, a GPU shader compiler).
#   libvtcapture.so.1.0.0 has no TEXTREL and a non-executable stack.
# Check: P=$(systemctl show -p MainPID --value lg-hue-sync); grep -E 'Seccomp' /proc/$P/status
#   Expect Seccomp 2 and Seccomp_filters > 0. Look for "Operation not
#   permitted" in state/daemon.log.
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/60-syscalls.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
