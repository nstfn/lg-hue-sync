# 20-filesystem: the daemon can write only to state/.
# Restricts: the whole file system is read-only for the daemon and its
#   children (luna-send, systemctl), except /var/home/root/lg-hue-sync/state
#   and the API trees /dev, /proc and /sys. This closes the P0: the daemon can
#   no longer rewrite the root-run unit, hooks or scripts next to it.
#   /tmp and /var/tmp become private and empty. New files get mode 0600.
#   /proc shows only the daemon's own processes.
# Not used: ProtectHome=. It hides /home, /root and /run/user. If /home or
#   /root is a symlink into /var/home, systemd resolves the link and hides the
#   binary itself. Enable it only after this check shows no link into
#   /var/home:  readlink -f /home /root
#   ProtectHome=read-only is then the safe value; tmpfs would hide nothing
#   useful here because the binary is under /var/home.
# Still writable (not files on a disk, or sockets): /dev/shm (pmloglib.lock,
#   ls2.monitor.shm), the Luna hub socket /var/run/luna-service2/com.palm.hub
#   and /run/systemd/private. A read-only mount does not block connect() on
#   a Unix socket.
# Could break: a library or luna-send that writes outside state/ (EROFS in
#   daemon.log), or that shares a file in /tmp with another process.
# Check: systemctl show lg-hue-sync -p ProtectSystem -p ReadWritePaths -p PrivateTmp -p UMask -p ProtectProc
#   Write probe (expect "Read-only file system", then "ok"):
#   systemd-run --wait --pipe -p ProtectSystem=strict -p ReadWritePaths=/var/home/root/lg-hue-sync/state /bin/sh -c 'touch /var/home/root/lg-hue-sync/probe; touch /var/home/root/lg-hue-sync/state/probe && rm /var/home/root/lg-hue-sync/state/probe && echo ok'
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/20-filesystem.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
ProtectSystem=strict
ReadWritePaths=/var/home/root/lg-hue-sync/state
PrivateTmp=yes
UMask=0077
ProtectProc=invisible
