# 10-resources: CPU, I/O, memory and process limits.
# Restricts: CPU time (60 % of one core), CPU share against other services,
#   nice and I/O priority, memory (96 MiB hard), open files, core dumps,
#   OOM-killer preference.
# Measured on 2026-10-29: 10 threads, 9.4 MB RSS, about 19 % of one core.
# How systemd 255 applies this on cgroup v1 (no unified hierarchy):
#   CPUQuota=     -> cpu.cfs_quota_us (period 100 ms) in the cpu,cpuacct tree.
#   CPUWeight=    -> translated to cpu.shares (weight 50 -> 512 shares).
#   MemoryMax=    -> translated to memory.limit_in_bytes in the memory tree.
#                    cgroup v1 also charges page cache (daemon.log writes),
#                    which the kernel reclaims before an OOM kill.
#   MemoryHigh=   -> NO cgroup v1 equivalent. systemd ignores it here. It is
#                    kept so the file stays correct on cgroup v2.
#   Nice=, IOScheduling*, Limit*, OOMScoreAdjust= -> per-process settings,
#                    no cgroup needed. IOScheduling* has no effect when the
#                    block queue scheduler is "none".
#   TasksMax= is absent on purpose: there is no pids controller.
# Could break: CPUQuota throttling lowers the capture fps under load;
#   MemoryMax could OOM-kill the daemon and its luna-send children.
# Check: systemctl show lg-hue-sync -p CPUQuotaPerSecUSec -p CPUWeight -p MemoryMax -p Nice -p OOMScoreAdjust -p LimitNOFILE
#   CG=$(systemctl show -p ControlGroup --value lg-hue-sync)
#   cat /sys/fs/cgroup/cpu,cpuacct$CG/cpu.cfs_quota_us   (expect 60000)
#   cat /sys/fs/cgroup/cpu,cpuacct$CG/cpu.shares         (expect 512)
#   cat /sys/fs/cgroup/memory$CG/memory.limit_in_bytes   (expect 100663296)
#   grep nr_throttled /sys/fs/cgroup/cpu,cpuacct$CG/cpu.stat (must grow slowly)
#   P=$(systemctl show -p MainPID --value lg-hue-sync); cat /proc/$P/oom_score_adj; grep -E 'open files|core file' /proc/$P/limits
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/10-resources.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
CPUQuota=60%
CPUWeight=50
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=6
MemoryHigh=64M
MemoryMax=96M
LimitNOFILE=512
LimitCORE=0
OOMScoreAdjust=500
