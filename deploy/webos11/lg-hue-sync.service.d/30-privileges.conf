# 30-privileges: no Linux capabilities and no new privileges.
# Restricts: the daemon stays uid 0 (luna-send is root-only), but it holds no
#   capability. It cannot bypass file modes (CAP_DAC_OVERRIDE), load modules,
#   change other processes, gain privileges through setuid binaries, create
#   setuid files, change its personality, use real-time scheduling or create
#   namespaces.
# RestrictSUIDSGID, LockPersonality, RestrictRealtime and RestrictNamespaces
#   use seccomp. They need a systemd built with +SECCOMP (systemctl --version).
# Could break: an ioctl on /dev/video60 that the LG driver gates on a
#   capability (CAP_SYS_ADMIN, CAP_SYS_RAWIO); a file the daemon reads that is
#   not readable by its owner bits for uid 0; a luna-send that needs a
#   capability. Measured: all threads are SCHED_OTHER, so RestrictRealtime
#   should not matter.
# Check: P=$(systemctl show -p MainPID --value lg-hue-sync); grep -E 'CapEff|CapBnd|CapAmb|NoNewPrivs|Seccomp' /proc/$P/status
#   Expect CapEff, CapBnd and CapAmb 0000000000000000, NoNewPrivs 1, Seccomp 2.
# Revert: rm /var/home/root/lg-hue-sync/lg-hue-sync.service.d/30-privileges.conf && /var/lib/webosbrew/init.d/05-lg-hue-sync && systemctl restart lg-hue-sync

[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
